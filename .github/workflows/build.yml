name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        combine: true
        sdk: latest
        bindings-ref: 5a28d381873e58bc08b8de3f7d73ec7f9444cd06
        target: ${{ matrix.config.target }}
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
    - uses: geode-sdk/build-geode-mod/combine@main
      id: build
    - uses: actions/upload-artifact@v4
      with:
        name: Build Output
        path: ${{ steps.build.outputs.build-output }}
